name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update -y &&
        sudo apt-get install -y \
        cmake \
        clang++ \
        build-essential \
        python
    - name: Install conan
      run: pip install --user conan
      
    - name: Run conan install
      run: conan install . --build=missing
    - name: Run conan build
      run: conan build .
      
    - name: Set build dir
      run: cmake -S . -B ./build
    - name: Build project
      run: cmake --build ./build
    - name: Enable tests
      run: cmake -DTESTS=ON ./build
    - name: Build tests
      run: cmake --build ./build
    - name: Run tests
      run: ./build/IpconfigTests
